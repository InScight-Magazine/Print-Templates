  "Author": "Aniket Bajaj"
  "Affiliation": "Department of Physical Sciences, IISER Kolkata"
  "Title": "Thermal-breach memory: Harnessing metastability for sensing to artificial neurons"
  "Summary": "In everyday life, memories often surface in unexpected and seemingly random ways. Interestingly, various forms of memory have also been identified in the physical world—ranging from magnetic systems and shape memory alloys to emerging fields like neuromorphic computing. In these systems, \"memory\" refers to the dependence of a system's current state on its history, often manifesting as multivalued or path-dependent behaviour. A system that has not yet fully relaxed to equilibrium can retain information about its creation or prior states, while one that has reached equilibrium loses all traces of its past—the act of equilibration effectively erases its memory.


Recently, our group, led by Prof. B. Bansal, has identified a novel form of memory in phase change materials, coined as thermal-breach memory. Initially, in collaboration with Prof. D. D. Sarma’s group at IISc Bangalore, we discovered this phenomenon in a well-known halide perovskite material (MAPbI3) which has thermally-induced phase change at low temperatures (~ 150 K). And later, by recognizing the broad potential of this memory effect; we collaborated with Prof. D. K. Shukla’s group at UGC-DAE CSR, Indore; to establish this fundamental concept for room temperature applications using another phase change material, vanadium dioxide (VO2). 


These materials exhibit a key characteristic during their phase transition—hysteresis—where the phase fraction follows different paths depending on whether the external parameter (in this case, temperature) is increasing or decreasing (see figure). Memory effects require the system to be in a non-equilibrium state, which corresponds to the hysteretic (metastable) region. And we found that when the system is held within this coexistence region at a constant temperature, the metastable phase becomes \"frozen,\" showing no further progression toward the stable phase. If some perturbation is given to these isothermal conditions, one can track the breach by monitoring the corresponding behaviour of the frozen phase because its response to the given perturbation depends on the history of its creation (prepared while heating or cooling, see figure). This distinct behaviour enables the detection of thermal breaches as small as one degree.


Thus, athermal states in phase change materials enable thermal-breach memory, by detecting small thermal breaches via distinct response of its phase fraction, offering stable, sensitive operation for sensor and neuromorphic applications."
  "Reference": "Aniket Bajaj, Satyaki Kundu, Shikha Sahu, D. K. Shukla, Bhavtosh Bansal. Appl. Phys. Lett. 127, 021902 (2025)"
  "Url": "https://doi.org/10.1063/5.0276973"
  "Image": "aniket.svg"
  "Caption": "Encoding-decoding of thermal-breach memory: Materials such as MAPbI3 and VO2 exhibit hysteresis during their phase transition, where the phase fraction follows different paths depending on whether the external parameter (here, temperature) is increasing or decreasing. This gives rise to a phase-coexistence region (as shown with shaded area). We found that when the system is brought into this region via heating (dotted red) or cooling (dotted blue) and held at a constant temperature, the metastable phase becomes frozen (red and blue square), showing no further evolution toward the stable phase. And further, upon introducing a small perturbation under these isothermal conditions, the decoding occurs: the response of the frozen phase depends on its thermal history. This history-dependent, distinct response enables detection of thermal breaches and highlights the potential of such systems for sensing and neuromorphic computing applications. Adapted from reference."
  "Keywords":
    - Phase transitions
    - Strongly correlated electron systems
    - Nonvolatile memory
