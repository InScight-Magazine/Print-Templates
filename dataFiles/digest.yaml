  "Author": "Swarnendu Saha"
  "Title": "Listening to Rivers: How Stream flow Can Help Us Understand Rainfall Better"
  "Affiliation": "Department of Physical Sciences, IISER Kolkata (20MS)"
  "Image": "swarnendu.png"
  "Caption": "Schematic overview of the study’s inverse modelling approach and validation steps for improving precipitation estimates using stream flow discharge. The left panel shows two neural network setups for “Inverse experiments”: the top network predicts precipitation using only meteorological and static inputs, while the bottom network additionally uses discharge as input, illustrating the novel approach of inferring precipitation from stream flow. The right side is divided into three validation sections: the top (“Continental Scale Analysis”) displays application across European catchments; the middle (“Out of Sample Test”) demonstrates independent validation; the bottom (“Hydrological Modelling”) shows how the discharge-informed precipitation feeds hydrological models (HBV, CATFLOW) for simulating soil moisture and stream flow. Together, these subplots capture the workflow from inverse prediction, large-scale and site-specific validation, to testing hydrological consequences. Adapted from reference."
  "Summary": "Understanding rainfall is key for managing water, predicting floods, and studying climate—but measuring it directly is tricky. Rain gauges and satellites often miss details or have errors. This paper explores a creative idea: can we use the water flowing out of rivers (stream flow) to better estimate how much rain actually fell in a region? In other words, can we trace rainfall backward from the river’s response?


This sounds simple but isn’t. Stream flow depends not only on rain, but also on evaporation, soil moisture, and groundwater—all of which mix together in complicated ways. Many different rain patterns can produce similar river flows, so working backward to find the exact rainfall is impossible. Instead, the researchers aim to estimate the average rainfall over a catchment, which is more realistic and useful.


To tackle this, they use a type of artificial intelligence called an LSTM (Long Short-Term Memory) neural network. It’s good at handling time-dependent data, like how rivers respond to rain with delays. They train two models: one predicts rainfall using weather data such as temperature and humidity, while the other adds river discharge information. Comparing the two shows whether including river data actually helps.


The results are promising. The model that includes streamflow performs about 20% better in estimating rainfall, especially in areas with good data. However, it slightly underestimates rainfall overall, meaning some adjustments are still needed. When these improved rainfall estimates are used in hydrological models, they better match real-world observations of soil moisture and floods—showing that this method captures important water-cycle behavior.


The authors note that the approach relies on good-quality data and could benefit from newer AI techniques in the future. Still, their work demonstrates a powerful concept: using river flow (the effect) to learn about rainfall (the cause). It’s a fresh way of combining machine learning with hydrology—looking at the water cycle in reverse—to improve rainfall estimates where observations are limited.


In short, the study shows how “listening” to rivers can help us better understand the rain that feeds them, offering a smart and practical step forward for water and climate science."
  "Reference": "Dean, J.F., Coxon, G., Zheng, Y. et al. Old carbon routed from land to the atmosphere by global river systems. Nature 642, 105–111 (2025)"
  "Url": "https://doi.org/10.1038/s41586-025-09023-w"
  "Keywords":
   - River CO#sub[2] emissions
   - Radiocarbon dating
   - Global carbon cycle
